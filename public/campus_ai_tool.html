<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --success: #16a34a;
            --success-bg: #dcfce7;
            --error: #dc2626;
            --error-bg: #fee2e2;
            --radius-lg: 16px;
            --radius-md: 10px;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            padding: 40px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .wrapper {
            width: 100%;
            max-width: 720px;
        }

        .header {
            text-align: center;
            margin-bottom: 36px;
        }

        .header h2 {
            color: var(--text-main);
            margin: 0 0 8px 0;
            font-size: 2.25rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .header p {
            color: var(--text-muted);
            font-size: 1.05rem;
            margin: 0;
        }

        .card-container {
            background: var(--card-bg);
            padding: 32px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            margin-bottom: 24px;
        }

        textarea {
            width: 100%;
            height: 130px;
            padding: 16px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            resize: vertical;
            box-sizing: border-box;
            background: #f8fafc;
            color: var(--text-main);
            transition: all 0.2s ease;
            margin-bottom: 20px;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .file-upload-wrapper {
            margin-bottom: 24px;
        }

        .file-upload-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #f8fafc;
            border: 2px dashed var(--border-color);
            border-radius: var(--radius-md);
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .file-upload-label:hover, .file-upload-label.dragover {
            border-color: var(--primary);
            background: #eff6ff;
        }

        .file-upload-label svg {
            width: 32px;
            height: 32px;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .file-upload-text {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .file-upload-subtext {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .size-warning {
            font-size: 0.75rem;
            color: #d97706;
            margin-top: 6px;
            font-weight: 500;
        }

        input[type="file"] {
            display: none;
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        button {
            padding: 14px 28px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        button:active {
            transform: translateY(0);
            box-shadow: 0 1px 2px rgba(37, 99, 235, 0.2);
        }

        button.secondary {
            background: #475569;
            box-shadow: 0 2px 4px rgba(71, 85, 105, 0.2);
        }

        button.secondary:hover {
            background: #334155;
            box-shadow: 0 4px 12px rgba(71, 85, 105, 0.3);
        }

        button:disabled {
            background: #cbd5e1;
            color: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #result {
            margin-top: 24px;
        }

        .result-section {
            background: var(--card-bg);
            padding: 28px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-section h3 {
            margin-top: 0;
            color: var(--primary);
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 12px;
            font-size: 1.25rem;
            font-weight: 600;
        }

        .flashcard {
            background: #f8fafc;
            border-left: 4px solid var(--primary);
            padding: 18px;
            margin-top: 14px;
            border-radius: 0 var(--radius-md) var(--radius-md) 0;
            border-top: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
        }

        .flashcard strong {
            color: var(--text-main);
            display: block;
            margin-bottom: 6px;
        }

        .flashcard em {
            color: var(--text-muted);
            font-style: normal;
        }

        .quiz-card {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            padding: 20px;
            margin-top: 16px;
            border-radius: var(--radius-md);
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 14px;
        }

        .quiz-option-btn {
            background: #ffffff;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            text-align: left;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.95rem;
            box-shadow: none;
            transition: all 0.2s ease;
        }

        .quiz-option-btn.hover:not(:disabled) {
            background: #f1f5f9;
            border-color: var(--primary);
        }

        .quiz-option-btn.correct {
            background: var(--success-bg) !important;
            color: var(--success) !important;
            border-color: var(--success) !important;
            font-weight: 600;
        }

        .quiz-option-btn.incorrect {
            background: var(--error-bg) !important;
            color: var(--error) !important;
            border-color: var(--error) !important;
        }

        .feedback-msg {
            margin-top: 12px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .loading {
            text-align: center;
            color: var(--text-muted);
            font-style: italic;
            padding: 30px;
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
        }

        footer {
            text-align: center;
            margin-top: 40px;
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            margin: 0 4px;
        }

        footer a:hover {
            text-decoration: underline;
        }

        .loading-card {
            text-align: center;
            padding: 40px 20px;
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            animation: fadeIn 0.3s ease-out forwards;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid #e2e8f0;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-weight: 600;
            color: var(--text-main);
            font-size: 1.05rem;
            margin: 0;
        }

        .loading-subtext {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="header">
            <h2>AI Study Assistant</h2>
            <p>Transform notes or PDF lectures into crisp summaries, quizzes, and flashcards.</p>
        </div>

        <div class="card-container">
            <textarea id="notes" placeholder="Paste your messy lecture notes or text here..."></textarea>
            
            <div class="file-upload-wrapper">
                <label for="pdfFile" class="file-upload-label" id="dropzoneLabel">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                    </svg>
                    <span class="file-upload-text" id="fileNameDisplay">Click or drag & drop PDF lecture notes here</span>
                    <span class="file-upload-subtext">Supports vector or scanned PDF documents</span>
                    <span class="size-warning">⚠️ Max recommended file size: 10MB to avoid connection timeouts</span>
                </label>
                <input type="file" id="pdfFile" accept="application/pdf" onchange="handleFileSelect()">
            </div>

            <div class="btn-group">
                <button id="generateBtn" onclick="generate()">Generate Study Kit</button>
                <button id="downloadBtn" class="secondary" onclick="downloadFlashcards()" style="display: none;">Download Kit</button>
            </div>
        </div>

        <div id="result"></div>
    </div>

    <footer>
        <p>&copy; 2026 Developed by <span style="font-weight: 600; color: var(--text-main);">Peter Sapountzis</span> | 
           <a href="https://github.com/Petersap4" target="_blank">GitHub</a> • 
           <a href="https://www.linkedin.com/in/peter-sapountzis-b78270209/" target="_blank">LinkedIn</a>
        </p>
    </footer>

    <script>
        let currentData = null;

        const dropzone = document.getElementById('dropzoneLabel');
        const fileInput = document.getElementById('pdfFile');

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropzone.addEventListener(eventName, preventDefaults, false);
            document.body.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropzone.addEventListener(eventName, () => dropzone.classList.add('dragover'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropzone.addEventListener(eventName, () => dropzone.classList.remove('dragover'), false);
        });

        // Handle dropped files
        dropzone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            if (files.length > 0) {
                fileInput.files = files;
                handleFileSelect();
            }
        }, false);

        function handleFileSelect() {
            const input = document.getElementById('pdfFile');
            const display = document.getElementById('fileNameDisplay');
            
            if (input.files && input.files.length > 0) {
                const file = input.files[0];
                const maxSize = 10 * 1024 * 1024; // 10MB limit warning threshold

                if (file.size > maxSize) {
                    alert(`Warning: Selected file is ${(file.size / (1024 * 1024)).toFixed(1)}MB. Files larger than 10MB can cause connection timeouts. Please upload a smaller or compressed PDF.`);
                    input.value = ''; // clear selection
                    display.innerText = "Click or drag & drop PDF lecture notes here";
                    return;
                }

                display.innerText = "Selected: " + file.name;
            } else {
                display.innerText = "Click or drag & drop PDF lecture notes here";
            }
        }

        async function generate() {
            const notes = document.getElementById('notes').value;     // get the notes from the textarea
            const pdfInput = document.getElementById('pdfFile').files[0];
            const resultDiv = document.getElementById('result');      // get the div where results will be displayed
            const generateBtn = document.getElementById('generateBtn');
            const downloadBtn = document.getElementById('downloadBtn');

            if (!notes && !pdfInput) {
                alert('Please either paste text notes or upload a PDF file!');
                return;
            }

            generateBtn.disabled = true;
            downloadBtn.style.display = 'none';

            resultDiv.innerHTML = `
                <div class="loading-card">
                    <div class="spinner"></div>
                    <div>
                        <p class="loading-text">Getting everything ready for you...</p>
                        <p class="loading-subtext">This may take a minute or two depending on file size.</p>
                    </div>
                </div>
            `;                                       // display a loading message while waiting for the backend response

            try {
                const formData = new FormData();
                if (pdfInput) {
                    formData.append('pdfFile', pdfInput);
                } else {
                    // send a POST request to the backend server with the notes
                    formData.append('topicNotes', notes);
                }

                const response = await fetch('http://localhost:3000/api/generate-study-material', {
                    method: 'POST',
                    // specify that the request body handles multipart/form-data or json accordingly
                    body: formData
                });

                if (!response.ok) throw new Error('Server response failed');

                currentData = await response.json();                     // parse the JSON response from the backend

                let html = `
                    <div class="result-section">
                        <h3>Summary</h3>
                        <p style="line-height: 1.7; color: #334155; margin-bottom: 0;">${currentData.summary}</p>
                    </div>
                    <div class="result-section">
                        <h3>Interactive Quiz</h3>
                `;

                if (currentData.quiz && currentData.quiz.length > 0) {
                    currentData.quiz.forEach((q, qIndex) => {
                        html += `
                            <div class="quiz-card" id="quiz-card-${qIndex}">
                                <strong style="color: var(--text-main); font-size: 1.02rem;">Q${qIndex + 1}: ${q.question}</strong>
                                <div class="quiz-options">
                        `;
                        q.options.forEach((opt) => {
                            html += `<button class="quiz-option-btn" onclick="checkAnswer(${qIndex}, '${escapeHtml(opt)}', '${escapeHtml(q.correctAnswer)}')">${opt}</button>`;
                        });
                        html += `</div><div class="feedback-msg" id="feedback-${qIndex}"></div></div>`;
                    });
                } else {
                    html += `<p>No quiz generated.</p>`;
                }

                html += `</div><div class="result-section"><h3>Flashcards</h3>`;

                if (currentData.flashcards && currentData.flashcards.length > 0) {              // check if flashcards were returned in the response
                    currentData.flashcards.forEach((fc, index) => {                             // loop through each flashcard and create a card for it
                        html += `
                            <div class="flashcard">
                                <strong>Q${index + 1}: ${fc.question}</strong>
                                <em>A: ${fc.answer}</em>
                            </div>
                        `;
                    });
                }

                html += `</div>`;
                resultDiv.innerHTML = html;                                                     // display the generated summary and flashcards in the result div
                downloadBtn.style.display = 'inline-flex';

            } catch (err) {
                console.error(err);
                resultDiv.innerHTML = `<div class="result-section" style="color: var(--error); background: var(--error-bg);"><strong>Error:</strong> Error connecting to backend server or request timed out.</div>`;            // display an error message if the request fails
            } finally {
                generateBtn.disabled = false;
            }
        }

        function checkAnswer(qIndex, selectedOption, correctAnswer) {
            const card = document.getElementById(`quiz-card-${qIndex}`);
            const buttons = card.querySelectorAll('.quiz-option-btn');
            const feedback = document.getElementById(`feedback-${qIndex}`);

            buttons.forEach(btn => {
                btn.disabled = true;
                if (btn.innerText.trim() === correctAnswer.trim()) {
                    btn.classList.add('correct');
                } else if (btn.innerText.trim() === selectedOption.trim()) {
                    btn.classList.add('incorrect');
                }
            });

            if (selectedOption.trim() === correctAnswer.trim()) {
                feedback.style.color = 'var(--success)';
                feedback.innerText = 'Correct! Great job.';
            } else {
                feedback.style.color = 'var(--error)';
                feedback.innerText = `Incorrect. The correct answer was: ${correctAnswer}`;
            }
        }

        function escapeHtml(str) {
            return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        function downloadFlashcards() {
            if (!currentData) return;

            let fileContent = "AI STUDY ASSISTANT - KIT\n===============================\n\n";
            fileContent += "SUMMARY:\n" + currentData.summary + "\n\n===============================\n\nQUIZ:\n\n";
            
            if (currentData.quiz) {
                currentData.quiz.forEach((q, i) => {
                    fileContent += `Q${i + 1}: ${q.question}\nCorrect Answer: ${q.correctAnswer}\n\n`;
                });
            }

            fileContent += "===============================\n\nFLASHCARDS:\n\n";
            if (currentData.flashcards) {
                currentData.flashcards.forEach((fc, index) => {
                    fileContent += `Q${index + 1}: ${fc.question}\nA: ${fc.answer}\n\n`;
                });
            }

            const blob = new Blob([fileContent], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'auth-study-kit.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
